name: Daily 9:00 AM Job Digest & Pages Refresh (Aksam Akbar)

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST (Indian Standard Time)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  send-daily-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Discovery, Digest & Static Export
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL || 'aksamakbar@gmail.com' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ats/daily_digest_job.py

      - name: Commit and Push Refreshed Openings & Static Site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ ats/storage/
          git diff --staged --quiet || (git commit -m "Auto-refresh 9:00 AM daily job openings & digest for $(date +'%Y-%m-%d') [skip ci]" && git push origin main)

      - name: Upload Daily Digest Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-job-digest
          path: ats/storage/digests/
          retention-days: 7
